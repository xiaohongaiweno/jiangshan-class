# 江山课堂 · nginx 站点配置
# 安装：sudo cp deploy/nginx-jiangshan.conf /etc/nginx/conf.d/jiangshan.conf
#       sudo sed -i 's/classroom.example.com/你的域名/' /etc/nginx/conf.d/jiangshan.conf
#       sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d 你的域名   （自动改写本文件为 443 并加跳转）
#
# 说明：Node 进程（server/index.js）同时提供静态文件与 /api/*，
# 所以这里整体反向代理即可，行为与本地 `npm start` 完全一致。
# 想进一步提速可让 nginx 直发静态资源（见文件末尾的可选段）。

upstream jiangshan_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name classroom.example.com;      # ← 改成你的域名或 IP

    # API 请求体上限 1MB，这里留余量
    client_max_body_size 2m;

    # 源码与数据库绝不经 nginx 暴露（Node 端也会拦，这里是第二道闸）
    location ~ ^/(server|node_modules|\.git|\.codebuddy|\.env) { return 404; }
    location ~ /\. { return 404; }

    location / {
        proxy_pass http://jiangshan_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 静态资源长缓存（Node 已发 Cache-Control，这里只做 gzip 兜底）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# ── 可选：静态资源交给 nginx 直发，比 Node 流式读盘更快 ──────────────
