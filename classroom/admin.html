<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>站长统计 · 江山课堂</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<style>
  body { font-family: system-ui, sans-serif; background: #f6f7f9; color: #222; margin: 0; padding: 24px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
  #gate { max-width: 420px; margin: 60px auto; }
  #gate input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  #gate button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; text-align: center; }
  .stat b { display: block; font-size: 26px; }
  .stat span { color: #6b7280; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { color: #6b7280; font-weight: 500; }
  .err { color: #dc2626; font-size: 14px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eff6ff; color: #2563eb; }
  .tag.s { background: #f0fdf4; color: #16a34a; }
  footer { color: #9ca3af; font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="card">
    <h1>站长统计</h1>
    <p style="color:#6b7280;font-size:14px">输入管理口令（存在本机 localStorage，仅发送到 /api/admin/stats）</p>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" />
    <button id="go">查看</button>
    <p class="err" id="gate-err" hidden></p>
  </div>

  <div id="dash" hidden>
    <h1>使用情况 · 总量</h1>
    <div class="cards" id="cards"></div>
    <div class="card">
      <h1 style="font-size:16px;margin-top:0">注册用户（新 → 旧）</h1>
      <table>
        <thead><tr><th>姓名</th><th>用户名</th><th>邮箱</th><th>注册时间</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <footer>数据来自 D1 聚合，不含答题明细；口令可在 Cloudflare Pages 项目环境变量 ADMIN_TOKEN 中修改。</footer>
  </div>
</div>
<script>
(function () {
  "use strict";
  const KEY = "js-admin-token";
  const $ = (s) => document.querySelector(s);
  const fmt = (t) => new Date(t).toLocaleString("zh-CN", { hour12: false });

  async function load(token) {
    const res = await fetch("/api/admin/stats", { headers: { "x-admin-token": token } });
    if (res.status === 404) throw new Error("服务端未设置 ADMIN_TOKEN，端点未启用");
    if (!res.ok) throw new Error(res.status === 403 ? "口令不正确" : "加载失败 " + res.status);
    return res.json();
  }

  function render(d) {
    const t = d.totals;
    const cards = [
      ["总用户", t.users], ["今日新增", t.today], ["活跃会话", t.sessions]
    ];
    $("#cards").innerHTML = cards.map(([k, v]) =>
      `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
    $("#users").innerHTML = d.users.map((u) => `<tr>
      <td>${u.name || ""}</td>
      <td>${u.username || "—"}</td>
      <td>${u.email || "—"}</td>
      <td>${fmt(u.created_at)}</td>
    </tr>`).join("") || "<tr><td colspan=4>暂无用户</td></tr>";
    $("#gate").hidden = true;
    $("#dash").hidden = false;
  }

  $("#go").addEventListener("click", async () => {
    const token = $("#token").value.trim();
    const errEl = $("#gate-err");
    errEl.hidden = true;
    try {
      const d = await load(token);
      localStorage.setItem(KEY, token);
      render(d);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.hidden = false;
    }
  });

  (async () => {
    const saved = localStorage.getItem(KEY);
    if (!saved) return;
    try { render(await load(saved)); }
    catch (e) {
      if (/口令/.test(e.message)) localStorage.removeItem(KEY);
      $("#gate-err").textContent = e.message;
      $("#gate-err").hidden = false;
    }
  })();
})();
</script>
</body>
</html>
