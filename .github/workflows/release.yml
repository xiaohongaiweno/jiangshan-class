# 江山时序（教学版）· 桌面版发布流水线
#
# 触发方式：
#   1. 推送 tag：git tag v1.0.1 && git push origin v1.0.1 → 自动构建并创建 GitHub Release
#   2. 手动：Actions 页面 Run workflow →
#      仅构建：默认不勾选"发布 Release"，产物只出现在 Artifacts
#      构建并发布：勾选"发布 Release"（可改标签名，如 v1.0.1），完成后自动创建 GitHub Release
#
# 产物：
#   - Windows x64 NSIS 安装包（.exe）
#   - macOS Apple Silicon（arm64）与 Intel（x64）DMG
#
# 说明：未配置代码签名（CSC_IDENTITY_AUTO_DISCOVERY=false），
#       Windows 用户会看到 SmartScreen 提示、macOS 需右键 → 打开；
#       如需签名，在此 workflow 中补充 CSC_LINK / CSC_KEY_PASSWORD 等 secrets。

name: Build Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建完成后直接发布 Release"
        type: boolean
        default: false
      tag:
        description: "Release 标签名（仅勾选发布时使用）"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            name: mac-arm64
            args: --mac dmg --arm64
          # macOS Intel（macos-13 runner 已退役，在 arm64 机器上交叉打包 x64）
          - os: macos-latest
            name: mac-x64
            args: --mac dmg --x64
          # Windows x64
          - os: windows-latest
            name: win-x64
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
